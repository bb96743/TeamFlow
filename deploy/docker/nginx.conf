# TeamFlow 前端 Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#
# ⚠️ 本配置未经实际运行验证（开发机无 Docker / Nginx）。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源压缩
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 前端构建产物哈希文件名可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理到后端容器（compose 服务名 backend:8080）
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # 上传大小上限：与后端 TEAMFLOW_FILE_MAX_SIZE（默认 20MB）对齐并留余量
        client_max_body_size 25m;
        proxy_read_timeout   60s;
    }

    # SPA history 路由回退（Vue Router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查直通后端（便于外部探针）
    location = /health {
        proxy_pass http://backend:8080/api/health;
        proxy_set_header Host $host;
    }
}
