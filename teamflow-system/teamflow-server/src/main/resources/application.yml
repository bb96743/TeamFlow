spring:
  application:
    name: teamflow-server
  profiles:
    active: dev
  # G-1 统一文件上传：容器层单文件/请求大小上限。与 teamflow.file.max-size 用同一环境变量，
  # 避免"服务层放行、容器层先拒"的双口径（超限时由 GlobalExceptionHandler 转 400 明确提示）。
  servlet:
    multipart:
      max-file-size: ${TEAMFLOW_FILE_MAX_SIZE:20MB}
      max-request-size: ${TEAMFLOW_FILE_MAX_SIZE:20MB}
  # ==================== G-4 数据库迁移（Flyway，2026-10-25 纳管） ====================
  # 脚本来源：teamflow-system/sql/V*.sql 是唯一数据源；构建时由 teamflow-server/pom.xml 的
  #   resources 配置复制到 classpath:db/migration，应用启动即自动迁移（可执行 JAR 内自带脚本）。
  # 已纳管版本：V1 建表（17 张 sys_/gen_ 表）、V2 种子数据、V3 okr_ 5 表、V4 okr 权限码。
  #   新增 DDL 一律追加 V5、V6…；禁止修改已发布的 V*.sql（M01 RULE R4）。
  #
  # baseline-on-migrate + baseline-version=2 的含义（Flyway 11.14.1 实测结论）：
  #   · 【全新空库】Flyway 判定 schema 为空 → baseline 被跳过，从 V1 全量执行
  #     （日志：All configured schemas are empty; baseline operation skipped）；
  #   · 【既有库（已有 22 张表、无 flyway_schema_history）】→ 自动建 history 并以 V1+V2 为
  #     baseline，只补跑 V3/V4（两脚本为 CREATE TABLE IF NOT EXISTS / INSERT IGNORE，可重复执行）；
  #   · 【危险】绝不能在空库上手工执行 flyway:baseline —— 会让 V1/V2 被跳过、17 张表缺失，
  #     V4 还会因 sys_menu 不存在而失败（2026-10-25 已实测复现）。baseline 只用于既有库。
  # 两条安全路径、判别方法与标准命令见 docs/项目技术栈与启动指南.md §4.3。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: "V1 init schema + V2 seed data (existing database baseline)"
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

server:
  port: 8080
  tomcat:
    # G-1：请求体超限时，容器需要「吞掉」剩余请求体才能把明确的 400 响应发回客户端。
    # Tomcat 默认 max-swallow-size=2MB，小于文件上限时超限请求会被直接断连（客户端只看到连接重置），
    # 因此这里必须大于 spring.servlet.multipart.max-file-size（默认 20MB）。
    max-swallow-size: ${TEAMFLOW_FILE_MAX_SWALLOW:30MB}

teamflow:
  api-prefix: /api
  jwt:
    secret: "${JWT_SECRET}"
    expires-seconds: 7200
  # G-1 统一文件上传（M00 平台能力，M03 附件 / M07 文档中心复用）
  # storage-path：本地存储根目录（生产建议绝对路径；容器内需挂载持久卷）；
  # max-size：单文件上限，默认 20MB（与 spring.servlet.multipart 同源，由 TEAMFLOW_FILE_MAX_SIZE 统一覆盖）；
  # denied-extensions：危险可执行/脚本后缀黑名单（始终生效），allowed-extensions 非空时再叠加白名单。
  file:
    storage-path: ${TEAMFLOW_FILE_STORAGE_PATH:./data/uploads}
    max-size: ${TEAMFLOW_FILE_MAX_SIZE:20MB}
    denied-extensions:
      - jsp
      - jspx
      - exe
      - sh
      - bat
      - cmd
      - dll
      - com
      - msi
      - scr
      - vbs
      - js
      - jar
      - war
      - class
      - php
      - asp
      - aspx
    allowed-extensions: []

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
